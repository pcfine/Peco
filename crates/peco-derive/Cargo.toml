[package]
name = "peco-derive"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Proc-macro for #[peco_tool] — own Tool derivation for peco-core"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
convert_case = "0.11"
proc-macro-crate = "3"
